<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" fill="none" class="brand-logo-svg">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="swooshFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="70%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>

  <!-- Left: Red Orbiting Arc -->
  <g transform="translate(10, 0)">
    <!-- Red ellipse ring wrapping around SA -->
    <path d="M 12 68 C -8 48, 14 18, 55 12 C 90 7, 122 20, 118 36 C 114 50, 85 58, 62 60 C 45 61, 25 72, 12 78 C 6 81, 2 80, 4 75 C 6 70, 14 66, 22 62" stroke="url(#redGradient)" stroke-width="7" stroke-linecap="round" fill="none" />
    
    <!-- SA Typography (Bold, Slanted) -->
    <!-- S -->
    <path d="M 28 44 C 28 35, 36 28, 54 28 C 72 28, 78 35, 78 41 L 62 41 C 62 37, 58 35, 52 35 C 46 35, 42 37, 42 41 C 42 47, 48 48, 62 51 C 78 54, 82 60, 82 69 C 82 78, 74 84, 52 84 C 32 84, 25 77, 25 67 L 41 67 C 41 73, 46 76, 54 76 C 62 76, 66 73, 66 68 C 66 62, 60 60, 46 57 C 32 54, 28 49, 28 44 Z" fill="#FFFFFF" transform="skewX(-16)" />
    <!-- A -->
    <path d="M 94 28 L 110 28 L 126 84 L 109 84 L 105 68 L 86 68 L 82 84 L 68 84 Z M 89 57 L 102 57 L 95 38 Z" fill="#FFFFFF" transform="skewX(-16)" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="152" y1="18" x2="152" y2="82" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />

  <!-- Right: SUPER ARC -->
  <g transform="translate(170, 0)">
    <!-- SUPER (White) -->
    <text x="0" y="52" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="-0.5px">SUPER</text>
    
    <!-- ARC (Red) -->
    <text x="162" y="52" fill="#DC2626" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="-0.5px">ARC</text>
    
    <!-- WELDING SYSTEM (White, spaced) -->
    <text x="22" y="76" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="19" letter-spacing="4px">WELDING SYSTEM</text>
    
    <!-- Bottom Red Swoosh Underline -->
    <path d="M 40 85 Q 160 83 290 92 Q 170 87 40 85 Z" fill="url(#swooshFade)" />
  </g>
</svg>
